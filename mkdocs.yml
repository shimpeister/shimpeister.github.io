site_name: Shimpei Kobayashi
site_description: 小林真平 — 微分幾何学・可積分系の研究と、企業の研究開発に向けた数理アドバイザリー
site_url: https://shimpeister.github.io/

repo_name: shimpeister/shimpeister.github.io
repo_url: https://github.com/shimpeister/shimpeister.github.io

nav:
  - Home: index.md
  - 企業の方へ: collaboration.md
  - Research:
      - Overview: research/index.md
      - Academic Profile & Demos: profile.md
      - Integrable Systems and Surface Geometry: research/integrable-systems.md
      - Teichmüller Theory and Harmonic Maps: research/teichmuller-harmonic-maps.md
      - Minimal Lagrangian and Product Geometries: research/minimal-lagrangian.md
      - Statistical, Hessian, and Affine Geometry: research/statistical-affine-geometry.md
      - Discrete Differential Geometry: research/discrete-geometry.md
  - Publications:
      - Overview: publications/index.md
      - Selected Publications: publications/selected.md
      - Publications by Theme: publications/by-theme.md
      - Complete List: publications/complete-list.md
      - Preprints and Miscellany: publications/preprints.md
  - Students:
      - For Prospective Students: students/index.md
      - Starting  Topics: students/seminar-themes.md
      - Thesis Topics: students/thesis-topics.md
  - Events:
      - Overview: events/index.md
      - Recent Advances in Geometric Structures: events/recent-advances-in-geometric-structures.md
  - Talks:
      - Overview: talks/index.md
      - Complete List: talks/complete-list.md
  - 3D Viewer: 3d-viewer.md
  - Contact: contact.md

plugins:
  - search

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: teal

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/viewer.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js
  - https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/controls/OrbitControls.js
  - https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/loaders/OBJLoader.js
  - assets/javascripts/obj-viewer.js

extra:
  analytics:
    provider: google
    property: G-TW1NBDWH5D
