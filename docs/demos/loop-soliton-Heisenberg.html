<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ループ・ソリトンの衝突と Heisenberg 群への持ち上げ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9E0E3; --ink:#1C2733; --muted:#56636F; --panel:rgba(236,240,242,.88);
  --line:#B7C1C7; --curve:#2C3F86; --shadow:#7C8A96; --floor:#C9D2D7; --k1:#2C3F86; --focus:#2C3F86;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D262E; --ink:#E6EBEE; --muted:#9AA7B1; --panel:rgba(33,43,52,.9);
    --line:#3A4955; --curve:#8FA6F2; --shadow:#6F7E8A; --floor:#26323C; --k1:#8FA6F2; --focus:#8FA6F2;
  }
}
:root[data-theme="dark"]{
  --bg:#1D262E; --ink:#E6EBEE; --muted:#9AA7B1; --panel:rgba(33,43,52,.9);
  --line:#3A4955; --curve:#8FA6F2; --shadow:#6F7E8A; --floor:#26323C; --k1:#8FA6F2; --focus:#8FA6F2;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block}
#stage canvas{touch-action:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;padding:20px 24px 0;pointer-events:none;max-width:36rem}
h1{font-family:"Source Serif 4","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;font-weight:600;font-size:1.3rem;line-height:1.3;margin:0 0 .35rem}
header p{margin:0;font-size:.85rem;line-height:1.55;color:var(--muted)}
.panel{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(21rem,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;backdrop-filter:blur(6px);font-size:.86rem}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row:first-child{margin-top:0}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;min-width:6.5rem}
button:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--curve)}
.lab{color:var(--muted);min-width:3.2rem}
.opt{display:flex;gap:8px;align-items:baseline;margin:4px 0}
.readout{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;margin-top:8px;line-height:1.5}
.kbox{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(26rem,calc(100% - 32px - 22rem));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px}
.kbox .cap{font-size:.78rem;color:var(--muted);margin:0 0 4px}
#kplot{width:100%;height:120px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:2rem;text-align:center}
@media (max-width:760px){ .kbox{display:none} }
@media (max-width:560px){ header{padding:14px 16px 0} h1{font-size:1.05rem} header p{display:none} }
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <h1>ループ・ソリトンの衝突と Heisenberg 群への持ち上げ</h1>
  <p>集束型 mKdV の 2 ソリトン解で動く Legendre 曲線（青）と、その平面への射影（灰色）。小さく速いループが大きく遅いループに追いつき、すり抜けて元の形で離れていきます。ドラッグで回転、スクロールかピンチで拡大できます。</p>
</header>
<div class="kbox" aria-hidden="true">
  <p class="cap">曲率 k(s, t)（横軸は弧長 s）</p>
  <canvas id="kplot"></canvas>
</div>
<div class="panel" role="region" aria-label="表示の操作">
  <div class="row">
    <button id="play" type="button">一時停止</button>
    <span class="lab">速さ</span>
    <input id="speed" type="range" min="0.02" max="0.5" step="0.01" value="0.12" aria-label="アニメーションの速さ">
  </div>
  <div class="row">
    <span class="lab">時刻</span>
    <input id="time" type="range" min="-0.7" max="0.7" step="0.001" value="-0.7" aria-label="時刻">
  </div>
  <div class="opt"><input type="checkbox" id="show-lift" checked><label for="show-lift">Legendre 曲線（持ち上げ）</label></div>
  <div class="opt"><input type="checkbox" id="show-proj" checked><label for="show-proj">平面への射影</label></div>
  <div class="readout" id="readout"></div>
</div>
<div id="err">この表示には WebGL が必要です。WebGL に対応したブラウザで開いてください。</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  if (typeof THREE === "undefined") { document.getElementById("err").style.display="flex"; return; }
  const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = n => new THREE.Color(cssv(n));

  // ---- two-soliton solution of k_t = k_sss + (3/2) k^2 k_s ----
  const p1 = 1.6, p2 = 2.8, A = Math.pow((p1-p2)/(p1+p2), 2);
  const S = 10, N = 1400, h = 2*S/(N-1), T = 0.7;
  function kval(s, t){
    const x = -s;
    const e1 = Math.exp(p1*x - p1*p1*p1*t), e2 = Math.exp(p2*x - p2*p2*p2*t);
    const G = e1 + e2, Gx = p1*e1 + p2*e2, F = 1 - A*e1*e2, Fx = -A*(p1+p2)*e1*e2;
    return 4*(Gx*F - G*Fx)/(F*F + G*G);
  }
  const K = new Float64Array(N), X = new Float64Array(N), Y = new Float64Array(N), Z = new Float64Array(N);
  function reconstruct(t){
    for (let i=0;i<N;i++) K[i] = kval(-S + i*h, t);
    // tangent angle, planar curve anchored at (-S,0) with direction e1 (far left end is at rest)
    let phi = 0, pc = 1, ps = 0; X[0] = -S; Y[0] = 0; Z[0] = 0;
    for (let i=1;i<N;i++){
      phi += 0.5*(K[i]+K[i-1])*h;
      const c = Math.cos(phi), sn = Math.sin(phi);
      X[i] = X[i-1] + 0.5*(c+pc)*h; Y[i] = Y[i-1] + 0.5*(sn+ps)*h;
      // Legendrian lift in H^1: z_s = -(x y_s - y x_s)
      const xm = 0.5*(X[i]+X[i-1]), ym = 0.5*(Y[i]+Y[i-1]);
      Z[i] = Z[i-1] - (xm*(Y[i]-Y[i-1]) - ym*(X[i]-X[i-1]));
      pc = c; ps = sn;
    }
  }

  // ---- three.js scene ----
  const stage = document.getElementById("stage");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); }
  catch(e){ document.getElementById("err").style.display="flex"; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
  camera.up.set(0,0,1);
  const target = new THREE.Vector3(-2.5, 0.4, 0.8);
  camera.position.set(-2.5 + 4, -17, 9);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(target); controls.enableDamping = true; controls.minDistance = 4; controls.maxDistance = 80;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(10,-20,30); scene.add(sun);

  const FLOOR = -4.2;
  const floorMat = new THREE.MeshBasicMaterial({color:col("--floor"), transparent:true, opacity:0.55, side:THREE.DoubleSide});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 9), floorMat);
  floor.position.set(-2.5, 0.5, FLOOR - 0.01); scene.add(floor);

  const tubeMat = new THREE.MeshStandardMaterial({color:col("--curve"), roughness:0.45, metalness:0.1});
  let tube = null;
  const projPos = new Float32Array(N*3);
  const projGeo = new THREE.BufferGeometry(); projGeo.setAttribute("position", new THREE.BufferAttribute(projPos,3));
  const projMat = new THREE.LineBasicMaterial({color:col("--shadow")});
  const proj = new THREE.Line(projGeo, projMat); proj.frustumCulled = false; scene.add(proj);

  const pts = []; for (let i=0;i<N;i+=2) pts.push(new THREE.Vector3());
  function rebuild(){
    let j = 0;
    for (let i=0;i<N;i+=2){ pts[j++].set(X[i], Y[i], Z[i]); }
    for (let i=0;i<N;i++){ projPos[3*i]=X[i]; projPos[3*i+1]=Y[i]; projPos[3*i+2]=FLOOR; }
    projGeo.attributes.position.needsUpdate = true;
    const path = new THREE.CatmullRomCurve3(pts, false, "centripetal");
    const g = new THREE.TubeGeometry(path, 900, 0.045, 8, false);
    if (tube){ tube.geometry.dispose(); tube.geometry = g; }
    else { tube = new THREE.Mesh(g, tubeMat); scene.add(tube); }
    tube.visible = document.getElementById("show-lift").checked;
    proj.visible = document.getElementById("show-proj").checked;
  }

  // ---- curvature plot ----
  const kc = document.getElementById("kplot"), kx = kc.getContext("2d");
  function drawK(){
    const r = window.devicePixelRatio || 1, w = kc.clientWidth, hh = kc.clientHeight;
    if (kc.width !== Math.round(w*r)) { kc.width = Math.round(w*r); kc.height = Math.round(hh*r); }
    kx.setTransform(r,0,0,r,0,0); kx.clearRect(0,0,w,hh);
    const kmax = 6, y0 = hh - 16, sy = (hh - 26)/kmax;
    kx.strokeStyle = cssv("--line"); kx.lineWidth = 1;
    kx.beginPath(); kx.moveTo(0,y0); kx.lineTo(w,y0); kx.stroke();
    kx.fillStyle = cssv("--muted"); kx.font = "11px Public Sans, system-ui, sans-serif";
    kx.fillText("s = −10", 2, hh-3); const lbl="s = 10"; kx.fillText(lbl, w - kx.measureText(lbl).width - 2, hh-3);
    kx.strokeStyle = cssv("--k1"); kx.lineWidth = 1.6; kx.beginPath();
    for (let i=0;i<N;i+=2){ const px = i/(N-1)*w, py = y0 - K[i]*sy; i===0 ? kx.moveTo(px,py) : kx.lineTo(px,py); }
    kx.stroke();
  }

  // ---- UI ----
  let t = -T, playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches, speed = 0.12;
  const playBtn = document.getElementById("play"), timeIn = document.getElementById("time");
  const setPlay = v => { playing = v; playBtn.textContent = v ? "一時停止" : "再生"; };
  setPlay(playing);
  playBtn.addEventListener("click", () => setPlay(!playing));
  document.getElementById("speed").addEventListener("input", e => speed = parseFloat(e.target.value));
  timeIn.addEventListener("input", e => { t = parseFloat(e.target.value); setPlay(false); dirty = true; });
  ["show-lift","show-proj"].forEach(id => document.getElementById(id).addEventListener("change", () => { dirty = true; }));
  const readout = document.getElementById("readout");

  function resize(){
    const w = stage.clientWidth, hh = stage.clientHeight;
    renderer.setSize(w, hh); camera.aspect = w/hh; camera.updateProjectionMatrix(); dirty = true;
  }
  let dirty = true;
  window.addEventListener("resize", resize); resize();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    tubeMat.color = col("--curve"); projMat.color = col("--shadow"); floorMat.color = col("--floor"); dirty = true;
  });

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.1, (now-last)/1000); last = now;
    if (playing){ t += dt*speed; if (t > T) t = -T; timeIn.value = t; dirty = true; }
    if (dirty){
      reconstruct(t); rebuild(); drawK();
      readout.textContent = `時刻 t = ${t.toFixed(3)}　（t = 0 付近で衝突）　p₁ = ${p1}, p₂ = ${p2}`;
      dirty = false;
    }
    controls.update(); renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
