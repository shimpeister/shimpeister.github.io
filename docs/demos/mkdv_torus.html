<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トーラス上の Legendre 曲線と mKdV 流</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9E0E3; --ink:#1C2733; --muted:#56636F; --panel:rgba(236,240,242,.86);
  --line:#B7C1C7; --plaster:#ECE8DF; --curve:#2C3F86; --bead:#101820; --focus:#2C3F86;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D262E; --ink:#E6EBEE; --muted:#9AA7B1; --panel:rgba(33,43,52,.88);
    --line:#3A4955; --plaster:#D8D3C8; --curve:#8FA6F2; --bead:#F3F5F6; --focus:#8FA6F2;
  }
}
:root[data-theme="dark"]{
  --bg:#1D262E; --ink:#E6EBEE; --muted:#9AA7B1; --panel:rgba(33,43,52,.88);
  --line:#3A4955; --plaster:#D8D3C8; --curve:#8FA6F2; --bead:#F3F5F6; --focus:#8FA6F2;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block;touch-action:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:20px 24px 0;pointer-events:none;max-width:40rem}
h1{font-family:"Source Serif 4","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;font-weight:600;font-size:1.35rem;line-height:1.3;margin:0 0 .35rem}
header p{margin:0;font-size:.86rem;line-height:1.55;color:var(--muted);max-width:34rem}
.panel{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(22rem,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;backdrop-filter:blur(6px);font-size:.86rem}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row:first-child{margin-top:0}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;min-width:6.5rem}
button:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--curve)}
fieldset{border:none;margin:10px 0 4px;padding:0}
legend{color:var(--muted);font-size:.8rem;margin-bottom:4px;padding:0}
label{cursor:pointer}
.opt{display:flex;gap:8px;align-items:baseline;margin:3px 0}
.readout{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;margin-top:8px;line-height:1.5}
.note{color:var(--muted);font-size:.78rem;line-height:1.5;margin:6px 0 0}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:2rem;text-align:center}
@media (max-width:560px){ header{padding:14px 16px 0} h1{font-size:1.1rem} header p{display:none} }
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <h1>トーラス上の Legendre 曲線と mKdV 流</h1>
  <p>Theorem 3.17 の回転する相対平衡解（p/q = 6/7）。Heisenberg 群の座標をそのまま描いています。ドラッグで回転、スクロールかピンチで拡大できます。</p>
</header>
<div class="panel" role="region" aria-label="表示の操作">
  <div class="row">
    <button id="play" type="button">一時停止</button>
    <label for="speed" style="color:var(--muted)">速さ</label>
    <input id="speed" type="range" min="0.2" max="12" step="0.1" value="3" aria-label="アニメーションの速さ">
  </div>
  <fieldset>
    <legend>Reeb ゲージ</legend>
    <div class="opt"><input type="radio" name="gauge" id="g-per" value="per" checked><label for="g-per">周期ゲージ（Reeb 項 c₀ξ）：曲線はトーラス上にとどまる</label></div>
    <div class="opt"><input type="radio" name="gauge" id="g-zero" value="zero"><label for="g-zero">正規化 C(t) = 0：曲線は −c₀t だけ上下にずれる</label></div>
  </fieldset>
  <fieldset>
    <legend>表示</legend>
    <div class="opt"><input type="checkbox" id="show-torus" checked><label for="show-torus">トーラス</label></div>
    <div class="opt"><input type="checkbox" id="glass"><label for="glass">トーラスを半透明にする</label></div>
    <div class="opt"><input type="checkbox" id="beads" checked><label for="beads">曲線上の点を表示</label></div>
    <div class="opt" style="margin-left:1.4rem"><input type="radio" name="nb" id="nb-1" value="1" checked><label for="nb-1">1 点だけ</label>
      <input type="radio" name="nb" id="nb-14" value="14" style="margin-left:.8rem"><label for="nb-14">14 点</label></div>
    <div class="opt" style="margin-left:1.4rem"><input type="checkbox" id="trail" checked><label for="trail">1 点目の軌跡を描く</label></div>
  </fieldset>
  <div class="readout" id="readout" aria-live="off"></div>
  <p class="note" id="gauge-note"></p>
</div>
<div id="err">この表示には WebGL が必要です。WebGL に対応したブラウザで開いてください。</div>
